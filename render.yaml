# Render Blueprint: NestJS API + free PostgreSQL. Dashboard → New → Blueprint → pick this repo.
databases:
  - name: flowtus-db
    plan: free
    databaseName: flowtus
    user: flowtus

services:
  - type: web
    name: flowtus-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm run build -w @flowtus/core && npm run build -w @flowtus/api
    startCommand: cd apps/api && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: flowtus-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        value: owner@flowtus.local
      - key: OWNER_PASSWORD
        generateValue: true
      - key: STAFF_EMAIL
        value: staff@flowtus.local
      - key: STAFF_PASSWORD
        generateValue: true
      - key: PUBLIC_WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
