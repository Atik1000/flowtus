services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowtus
      POSTGRES_PASSWORD: flowtus
      POSTGRES_DB: flowtus
    ports:
      - "5432:5432"
    volumes:
      - flowtus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowtus"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  flowtus_pg:
